server:
  port: 8080
spring:
  application:
    name: cyber-conexo
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cyberconexo}
    username: ${SPRING_DATASOURCE_USERNAME:cyberuser}
    password: ${SPRING_DATASOURCE_PASSWORD:cyberpass}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
