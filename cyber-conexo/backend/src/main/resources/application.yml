server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

spring:
  application:
    name: cyber-conexo
  datasource:
    # Sem senha padrão de propósito: a senha vem sempre do ambiente (.env no Docker).
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cyberconexo}
    username: ${SPRING_DATASOURCE_USERNAME:cyberuser}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false          # sessão do Hibernate só dentro do Service
    hibernate:
      ddl-auto: none             # quem cria/altera tabelas é o Flyway, nunca o Hibernate
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

app:
  cors:
    # Só necessário se o front rodar fora do Nginx (ex.: Live Server na porta 5500).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
