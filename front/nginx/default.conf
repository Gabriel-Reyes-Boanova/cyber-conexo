# Zonas de limite de requisições (ficam no contexto http porque este arquivo é incluído por conf.d)
limit_req_zone $binary_remote_addr zone=api_geral:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_tentativas:10m rate=5r/s;
limit_req_status 429;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Cabeçalhos de segurança (repetidos em "location /" porque add_header de um
    # location substitui os do nível server; as rotas /api/ herdam estes daqui).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Tentativas de grupo: limite mais rígido (dificulta força bruta no gabarito)
    location ~ ^/api/games/[0-9a-fA-F-]+/guesses$ {
        limit_req zone=api_tentativas burst=10 nodelay;
        proxy_pass http://backend:8080;
        include /etc/nginx/proxy_params.conf;
    }

    # Restante da API
    location /api/ {
        limit_req zone=api_geral burst=40 nodelay;
        proxy_pass http://backend:8080;
        include /etc/nginx/proxy_params.conf;
    }

    # Endpoints internos do Spring não são públicos
    location /actuator/ { return 404; }

    # Arquivos estáticos do front
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
}
